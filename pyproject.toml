# Tool configuration only: apfs-dedupe is not a Python package, and runs from
# its checkout.

[tool.ruff]
# The oldest Python the engine and its tests support.
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
# macOS-only code, type-checked on Linux in CI: check it as darwin wherever mypy
# runs. The shared pyright check reads this setting, and ruff's target-version
# above, for the platform and Python it checks for.
platform = "darwin"
strict = true
files = ["lib"]
