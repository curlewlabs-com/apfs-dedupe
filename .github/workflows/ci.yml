name: CI

# Gate every PR (and post-merge main) on the checks a contributor runs locally:
# strict mypy and pyright on Linux, and the real-clonefile integration test on
# macOS, plus the checks every Curlew Labs repository shares. See README
# "Development".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the pinned tools
        run: python -m pip install -r requirements-dev.txt
      - name: mypy (strict)
        run: mypy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # renovate: datasource=node-version depName=node
          node-version: 24.22.2
      - name: pyright (strict)
        # renovate: datasource=npm depName=pyright
        run: npx --yes pyright@1.1.414

  test:
    # The apply uses CLONE_NOFOLLOW_ANY, which Apple's headers do not define
    # before macOS 15, so the symlink-source test cases need a runner at 15 or
    # later.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The oldest Python the engine supports; test/test.sh runs it as python3.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The runner image ships rustup but not a fixed Rust, so the toolchain
      # that builds fclones is installed at an exact release.
      - name: install Rust
        env:
          # renovate: datasource=github-releases depName=rust-lang/rust
          RUST_VERSION: 1.99.1
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      # fclones publishes no macOS release asset, so build the exact crate
      # version the wrapper contract smoke is pinned to.
      - name: install fclones
        run: |
          # renovate: datasource=crate depName=fclones
          cargo install fclones --version 0.35.0 --locked
          # renovate: datasource=crate depName=fclones
          test "$(fclones --version)" = "fclones 0.35.0"
      - name: integration test (real APFS clonefile)
        run: sh test/test.sh

  baseline:
    # The checks every Curlew Labs repository runs, in one place:
    # https://github.com/curlewlabs-com/ci-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: curlewlabs-com/ci-baseline@f05f17a38ba2dfbaf0cde130a375b346e9a923a2 # v0.2.0

  conclusion:
    # The one check branch protection requires, so adding or renaming a job
    # above needs no settings change - only this list.
    needs: [lint, test, baseline]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every job to pass
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          BASELINE: ${{ needs.baseline.result }}
        run: test "$LINT" = success && test "$TEST" = success && test "$BASELINE" = success
