name: CI

# Gate every PR (and post-merge main) on the checks a contributor runs locally:
# shellcheck + strict pyright on Linux, and the real-clonefile integration test
# on macOS. See README "Development".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin shellcheck to an exact release rather than ubuntu's preinstalled,
      # floating version: older shellcheck misfires SC2317 on the trap-invoked
      # cleanup() that 0.11.0 and later read correctly.
      - name: shellcheck
        run: |
          # renovate: datasource=github-releases depName=koalaman/shellcheck extractVersion=^v(?<version>.+)$
          ver=0.11.0
          url="https://github.com/koalaman/shellcheck/releases/download/v${ver}/shellcheck-v${ver}.linux.x86_64.tar.xz"
          curl -fsSL "$url" | tar -xJ
          "shellcheck-v${ver}/shellcheck" --version
          "shellcheck-v${ver}/shellcheck" apfs-dedupe.sh install-daily.sh test/test.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # renovate: datasource=node-version depName=node
          node-version: 24.22.2
      - name: pyright (strict)
        # renovate: datasource=npm depName=pyright
        run: npx --yes pyright@1.1.414

  test:
    # macOS 15+ only: the apply uses CLONE_NOFOLLOW_ANY, which Apple's headers do
    # not define before 15, so the symlink-source test cases require a 15 runner.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner image ships rustup but not a fixed Rust, so the toolchain
      # that builds fclones is installed at an exact release.
      - name: install Rust
        env:
          # renovate: datasource=github-releases depName=rust-lang/rust
          RUST_VERSION: 1.99.1
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      # fclones publishes no macOS release asset, so build the exact crate
      # version the wrapper contract smoke is pinned to.
      - name: install fclones
        run: |
          # renovate: datasource=crate depName=fclones
          cargo install fclones --version 0.35.0 --locked
          # renovate: datasource=crate depName=fclones
          test "$(fclones --version)" = "fclones 0.35.0"
      - name: integration test (real APFS clonefile)
        run: sh test/test.sh
